<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>ゲームハブ</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: radial-gradient(circle at 50% 0%, #1b2140 0%, #0a0c1a 70%);
    font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    color: #eef0ff;
  }
  #page {
    max-width: 960px;
    margin: 0 auto;
    padding: 48px 20px 60px;
  }
  header {
    text-align: center;
    margin-bottom: 40px;
  }
  header h1 {
    margin: 0 0 8px;
    font-size: 34px;
    letter-spacing: 6px;
    font-weight: 700;
    color: #9fb4ff;
    text-shadow: 0 0 18px rgba(120,150,255,0.6);
  }
  header p {
    margin: 0;
    font-size: 14px;
    color: #9aa3d6;
  }
  .card {
    display: flex;
    flex-direction: column;
    background: rgba(255,255,255,0.03);
    border: 1px solid #2a3160;
    border-radius: 14px;
    padding: 22px;
    text-decoration: none;
    color: inherit;
    transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
  }
  .card:hover {
    transform: translateY(-4px);
    border-color: #6ea8ff;
    box-shadow: 0 10px 28px rgba(80,100,220,0.35);
  }
  .card .icon {
    font-size: 40px;
    line-height: 1;
    margin-bottom: 14px;
  }
  .card .title {
    font-size: 18px;
    font-weight: 700;
    color: #eef0ff;
    margin-bottom: 6px;
  }
  .card .desc {
    font-size: 13px;
    color: #b9c2f0;
    line-height: 1.5;
    flex: 1;
  }
  .card .tag {
    align-self: flex-start;
    margin-top: 14px;
    font-size: 11px;
    color: #ffe066;
    background: rgba(255,224,102,0.12);
    border: 1px solid rgba(255,224,102,0.35);
    padding: 3px 10px;
    border-radius: 999px;
  }
  .card.placeholder {
    align-items: center;
    justify-content: center;
    text-align: center;
    border-style: dashed;
    color: #6b74a8;
    cursor: default;
  }
  .card.placeholder:hover {
    transform: none;
    box-shadow: none;
    border-color: #3a4278;
  }
  .card.placeholder .icon { color: #4a5290; }
  .card.placeholder .desc { color: #6b74a8; }

  #tabs {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    padding: 12px 0;
    margin-bottom: 18px;
    background: rgba(10,12,26,0.85);
    backdrop-filter: blur(6px);
    border-radius: 0 0 14px 14px;
  }
  .tab {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(255,255,255,0.03);
    border: 1px solid #2a3160;
    color: #b9c2f0;
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
    transition: border-color 0.15s, color 0.15s, background 0.15s;
  }
  .tab:hover { border-color: #6ea8ff; color: #eef0ff; }
  .tab.active {
    background: linear-gradient(180deg, #5a6bff, #3444c4);
    border-color: transparent;
    color: #fff;
    box-shadow: 0 4px 14px rgba(60,80,255,0.45);
  }
  .tab .count {
    font-size: 11px;
    padding: 1px 7px;
    border-radius: 999px;
    background: rgba(255,255,255,0.12);
  }
  @media (max-width: 600px) {
    /* スマホではタブを1段にして横スクロール */
    #tabs { flex-wrap: nowrap; justify-content: flex-start; overflow-x: auto; scrollbar-width: none; margin: 0 -20px 18px; padding: 10px 20px; }
    #tabs::-webkit-scrollbar { display: none; }
    .tab { flex-shrink: 0; padding: 7px 13px; font-size: 13px; }
  }
  .section { margin-bottom: 36px; }
  .section-head {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin: 0 0 14px;
    padding-bottom: 8px;
    border-bottom: 1px solid #2a3160;
  }
  .section-head h2 {
    margin: 0;
    font-size: 20px;
    letter-spacing: 2px;
    color: #eef0ff;
  }
  .section-head p { margin: 0; font-size: 12px; color: #9aa3d6; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 22px;
  }
</style>
</head>
<body>
  <div id="page">
    <header>
      <h1>GAME HUB</h1>
      <p>遊びたいゲームを選んでください</p>
    </header>
    <nav id="tabs"></nav>
    <div id="sections"></div>
  </div>

<script>
  // 新しいゲームを追加するときは、この配列に1件足すだけでカードが増える（category でカテゴリを指定）
  const games = [
    {
      title: 'ブロック崩し',
      desc: 'パドルでボールを操り、ブロックを全て破壊しよう。レベルが進むほどスピードアップ。',
      icon: '🧱',
      href: 'games/breakout.html',
      category: 'digital',
      tag: '1人用'
    },
    {
      title: 'オセロ',
      desc: '対人戦・CPU戦を選べる定番の陣取りゲーム。CPUは終盤読み切り搭載。オンライン対戦にも対応。',
      icon: '⚫⚪',
      href: 'games/othello.html',
      category: 'board',
      tag: '1〜2人用'
    },
    {
      title: '藪の中',
      desc: '証言が食い違う中で犯人を推理するブラフゲーム。1台をパス&プレイ、または各自の端末でオンライン対戦。',
      icon: '🔍',
      href: 'games/yabu.html',
      category: 'other',
      tag: '3〜5人用'
    },
    {
      title: 'チェス',
      desc: '対人戦・CPU戦（3手読み）・オンライン対戦に対応。キャスリングやアンパッサンなど公式ルールを完全実装。',
      icon: '♟️',
      href: 'games/chess.html',
      category: 'board',
      tag: '1〜2人用'
    },
    {
      title: '将棋',
      desc: '持ち駒・成り・二歩・打ち歩詰めなど日本将棋のルールに対応。対人戦・CPU戦・オンライン対戦を選択可能。',
      icon: '🎌',
      href: 'games/shogi.html',
      category: 'board',
      tag: '1〜2人用'
    },
    {
      title: '囲碁',
      desc: '9路盤の陣取りゲーム。石を取り合い、地の広さを競う。対人戦・CPU戦・オンライン対戦に対応。',
      icon: '⚪',
      href: 'games/go.html',
      category: 'board',
      tag: '1〜2人用'
    },
    {
      title: '五目並べ',
      desc: '15路盤で縦横斜めに5つ並べたら勝ち。対人戦・CPU戦・オンライン対戦を選択できる定番ゲーム。',
      icon: '⭕',
      href: 'games/gomoku.html',
      category: 'board',
      tag: '1〜2人用'
    },
    {
      title: 'テトリス',
      desc: 'そろプレイ、またはCPU・対人（同画面/オンライン）とのおじゃま行対戦を選択可能なブロック落下パズル。',
      icon: '🧊',
      href: 'games/tetris.html',
      category: 'digital',
      tag: '1〜2人用'
    },
    {
      title: 'ぷよぷよ',
      desc: 'そろプレイ、またはCPU・対人（同画面/オンライン）との連鎖対戦を選択可能な落ちものパズル。',
      icon: '🟢',
      href: 'games/puyo.html',
      category: 'digital',
      tag: '1〜2人用'
    },
    {
      title: '軍議',
      desc: 'アニメで登場した架空のボードゲームを、駒を3段まで積み重ねられるオリジナルルールで再構築。「帥」を討てば勝利。対人戦・CPU戦・オンライン対戦に対応。',
      icon: '🗻',
      href: 'games/gungi.html',
      category: 'board',
      tag: '1〜2人用'
    },
    {
      title: 'ギシンアンキ',
      desc: '2人用の心理戦・人狼ゲーム。役職を隠したまま情報カードを引いたり要求したりして相手の正体を探り、「留まる」か「立ち去る」かで決着をつける。対人戦・CPU戦・オンライン対戦に対応。',
      icon: '🎭',
      href: 'games/gishinanki.html',
      category: 'other',
      tag: '2人用'
    },
    {
      title: 'ルドー',
      desc: 'サイコロを振って4つのコマをゴールへ運ぶすごろく系ボードゲーム。相手のコマを取って振り出しに戻せる。各色を人・CPUから選べるローカル対戦と、最大4人のオンライン対戦に対応。',
      icon: '🎲',
      href: 'games/ludo.html',
      category: 'board',
      tag: '1〜4人用'
    },
    {
      title: 'コードネーム',
      desc: '赤と青の2チームに分かれ、スパイマスターの「1語＋数字」のヒントから味方の諜報員の言葉を当てる。暗殺者を引いたら即負け。1台を囲んで遊ぶモードと、各自の端末で参加するオンライン対戦に対応。',
      icon: '🕵️',
      href: 'games/codenames.html',
      category: 'other',
      tag: '4人以上'
    },
    {
      title: '大富豪',
      desc: '手札を早くなくした人が勝ちのトランプゲーム。階段・革命・8切り・ジョーカーあり、ラウンド間のカード交換も再現。CPU戦とオンライン対戦（足りない人数はCPU）に対応。',
      icon: '👑',
      href: 'games/daifugo.html',
      category: 'trump',
      tag: '1〜6人用'
    },
    {
      title: 'スピード',
      desc: '台札と数字が1つ違うカードを早い者勝ちで出し合う、リアルタイムのトランプ対戦。CPU戦（3段階の強さ）とオンライン対戦に対応。',
      icon: '⚡',
      href: 'games/speed.html',
      category: 'trump',
      tag: '1〜2人用'
    },
    {
      title: '七並べ',
      desc: '7から順にカードをつなげて手札をなくそう。パスは3回まで、超えると脱落。CPU戦とオンライン対戦（足りない人数はCPU）に対応。',
      icon: '7️⃣',
      href: 'games/sevens.html',
      category: 'trump',
      tag: '1〜6人用'
    },
    {
      title: 'コヨーテ',
      desc: '自分のカードだけが見えない！場の合計を予想して数字を宣言し、怪しいと思ったら「コヨーテ！」。×2やMAX→0などの特殊カード入り。CPU戦とオンライン対戦に対応。',
      icon: '🐺',
      href: 'games/coyote.html',
      category: 'other',
      tag: '1〜8人用'
    },
    {
      title: 'インサイダーゲーム',
      desc: 'マスターへの質問でお題を当てつつ、答えを知っているのに隠れている「インサイダー」を探し出す推理ゲーム。1台を回して遊ぶモードと、チャットで質問するオンライン対戦に対応。',
      icon: '🕶️',
      href: 'games/insider.html',
      category: 'other',
      tag: '3〜8人用'
    },
    {
      title: 'ブラックジャック',
      desc: 'ディーラーより21に近づけよう。ヒット・スタンド・ダブル・スプリットに対応し、チップを賭けて勝負。ひとりでも、オンラインで同じテーブルを囲んでも遊べる。',
      icon: '♠️',
      href: 'games/blackjack.html',
      category: 'trump',
      tag: '1〜5人用'
    },
    {
      title: 'UNO',
      desc: '色か数字を合わせてカードを出し、手札を一番に出し切ろう。スキップ・リバース・ドロー2・ワイルドドロー4、UNO言い忘れペナルティあり。CPU戦とオンライン対戦に対応。',
      icon: '🟥',
      href: 'games/uno.html',
      category: 'other',
      tag: '2〜6人用'
    },
    {
      title: 'じゃんけん',
      desc: 'グー・チョキ・パーで最後の1人になるまで勝ち抜き。CPU戦と、最大6人のオンライン対戦に対応。',
      icon: '✊',
      href: 'games/janken.html',
      category: 'other',
      tag: '1〜6人用'
    },
    {
      title: 'ワードウルフ',
      desc: 'みんなで同じお題について話す中、ひとりだけ違うお題を持つ「ウルフ」を見つけ出す会話ゲーム。1台を回して遊ぶモードと、チャットで話すオンライン対戦に対応。',
      icon: '🗣️',
      href: 'games/wordwolf.html',
      category: 'other',
      tag: '3〜8人用'
    },
    {
      title: 'カタカナーシ',
      desc: 'カタカナの言葉を、カタカナを使わずに説明して当ててもらう説明ゲーム。オンラインでは説明にカタカナ・英字が入ると自動で没収。',
      icon: '🚫',
      href: 'games/katakanashi.html',
      category: 'other',
      tag: '2〜8人用'
    },
    {
      title: 'ウミガメのスープ',
      desc: '不思議な状況の真相を「はい・いいえ」で答えられる質問だけで推理する水平思考ゲーム。収録問題のほか自作問題も出題できる。',
      icon: '🐢',
      href: 'games/umigame.html',
      category: 'other',
      tag: '2〜10人用'
    }
  ];

  const categories = [
    { id: 'trump', name: 'トランプ', icon: '🃏', desc: '52枚のトランプで遊ぶカードゲーム' },
    { id: 'board', name: 'ボード', icon: '♟️', desc: '盤と駒・石を使う対戦ゲーム' },
    { id: 'digital', name: 'デジタル', icon: '🕹️', desc: 'アクション・落ちものパズル' },
    { id: 'other', name: 'その他', icon: '🎭', desc: 'パーティー・推理・心理戦' }
  ];

  const tabsEl = document.getElementById('tabs');
  const sectionsEl = document.getElementById('sections');

  function makeCard(g) {
    const card = document.createElement('a');
    card.className = 'card';
    card.href = g.href;
    card.innerHTML = `
      <div class="icon">${g.icon}</div>
      <div class="title">${g.title}</div>
      <div class="desc">${g.desc}</div>
      <div class="tag">${g.tag}</div>
    `;
    return card;
  }

  // 選んだカテゴリだけを表示（「すべて」はカテゴリごとに見出し付きで並べる）
  function render(selected) {
    tabsEl.innerHTML = '';
    const tabs = [{ id: 'all', name: 'すべて', icon: '✨' }, ...categories];
    for (const c of tabs) {
      const n = c.id === 'all' ? games.length : games.filter(g => g.category === c.id).length;
      const b = document.createElement('button');
      b.className = 'tab' + (c.id === selected ? ' active' : '');
      b.innerHTML = `<span>${c.icon}</span><span>${c.name}</span><span class="count">${n}</span>`;
      b.addEventListener('click', () => {
        try { localStorage.setItem('hub-category', c.id); } catch (e) {}
        render(c.id);
      });
      tabsEl.appendChild(b);
    }

    sectionsEl.innerHTML = '';
    for (const c of categories) {
      if (selected !== 'all' && selected !== c.id) continue;
      const list = games.filter(g => g.category === c.id);
      if (!list.length) continue;
      const section = document.createElement('section');
      section.className = 'section';
      section.innerHTML = `<div class="section-head"><h2>${c.icon} ${c.name}</h2><p>${c.desc}</p></div>`;
      const grid = document.createElement('div');
      grid.className = 'grid';
      list.forEach(g => grid.appendChild(makeCard(g)));
      section.appendChild(grid);
      sectionsEl.appendChild(section);
    }

    const placeholder = document.createElement('div');
    placeholder.className = 'card placeholder';
    placeholder.innerHTML = `
      <div class="icon">➕</div>
      <div class="title">Coming Soon</div>
      <div class="desc">次のゲームもここに追加されます</div>
    `;
    const lastGrid = sectionsEl.querySelector('.section:last-child .grid');
    if (lastGrid) lastGrid.appendChild(placeholder);
  }

  let initial = 'all';
  try { initial = localStorage.getItem('hub-category') || 'all'; } catch (e) {}
  if (initial !== 'all' && !categories.some(c => c.id === initial)) initial = 'all';
  render(initial);
</script>
</body>
</html>
