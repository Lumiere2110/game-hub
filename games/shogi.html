<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>将棋</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: radial-gradient(circle at 50% 0%, #1b2140 0%, #0a0c1a 70%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    color: #eef0ff;
    overflow-x: hidden;
    padding: 16px 0;
  }
  #wrap {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    width: 520px;
    max-width: 94vw;
  }
  #topbar { display: flex; justify-content: space-between; align-items: center; width: 100%; }
  h1 {
    margin: 0; font-size: 22px; letter-spacing: 4px; font-weight: 600;
    color: #9fb4ff; text-shadow: 0 0 12px rgba(120,150,255,0.6);
  }
  #back-btn, #hub-link {
    background: transparent; border: 1px solid #3a4278; color: #b9c2f0;
    padding: 6px 14px; border-radius: 999px; font-size: 12px; cursor: pointer; text-decoration: none;
  }
  #back-btn:hover, #hub-link:hover { border-color: #6ea8ff; color: #eef0ff; }
  #topbar-right { display: flex; gap: 8px; }

  #hud { display: flex; justify-content: space-between; width: 100%; gap: 10px; }
  .player-card {
    flex: 1; display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 10px;
    background: rgba(255,255,255,0.03); border: 1px solid #2a3160; transition: box-shadow 0.2s, border-color 0.2s;
  }
  .player-card.active { border-color: #6ea8ff; box-shadow: 0 0 14px rgba(110,168,255,0.45); }
  .player-info { display: flex; flex-direction: column; line-height: 1.3; }
  .player-name { font-size: 12px; color: #9aa3d6; }
  .player-status { font-size: 11px; color: #ff8a8a; min-height: 14px; }

  #hand-g, #hand-s {
    display: flex; flex-wrap: wrap; gap: 6px; width: 100%; min-height: 30px;
    padding: 4px; border-radius: 8px; background: rgba(255,255,255,0.02);
  }
  .hand-piece {
    display: flex; align-items: center; gap: 3px; padding: 4px 8px; border-radius: 8px;
    background: rgba(255,255,255,0.06); border: 1px solid #3a4278; cursor: pointer;
    font-size: 16px; color: #eef0ff;
  }
  .hand-piece.gote { transform: none; }
  .hand-piece .cnt { font-size: 11px; color: #ffe066; }
  .hand-piece.selected { border-color: #6ea8ff; box-shadow: 0 0 10px rgba(110,168,255,0.5); }
  .hand-piece.disabled { opacity: 0.35; cursor: default; pointer-events: none; }

  #board-area { position: relative; width: 100%; }
  #board {
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    grid-template-rows: repeat(9, 1fr);
    width: 100%;
    aspect-ratio: 1 / 1;
    background: #d8ad6d;
    border: 4px solid #7a5424;
    border-radius: 4px;
    box-shadow: 0 0 30px rgba(80,100,220,0.25), inset 0 0 40px rgba(0,0,0,0.25);
    overflow: hidden;
  }
  #board.disabled { pointer-events: none; opacity: 0.92; }
  .cell {
    position: relative; border: 1px solid rgba(0,0,0,0.28);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    font-size: clamp(16px, 5.6vw, 32px); line-height: 1; user-select: none;
  }
  .cell.last-from, .cell.last-to { box-shadow: inset 0 0 0 999px rgba(255, 224, 102, 0.28); }
  .cell.selected { box-shadow: inset 0 0 0 999px rgba(110, 168, 255, 0.45); }
  .cell.check { box-shadow: inset 0 0 0 999px rgba(255, 60, 60, 0.5); }
  .piece { transition: transform 0.1s; font-weight: 700; }
  .piece.s { color: #1a1206; }
  .piece.g { color: #1a1206; transform: rotate(180deg); }
  .piece.promoted { color: #b5231a; }
  .cell:hover .piece { transform: scale(1.08); }
  .piece.g:hover, .cell:hover .piece.g { transform: rotate(180deg) scale(1.08); }
  .dot-hint { position:absolute; width:26%; height:26%; border-radius:50%; background: rgba(0,0,0,0.25); pointer-events:none; }
  .dot-hint.capture { width:100%; height:100%; border-radius:0; background:transparent; box-shadow: inset 0 0 0 4px rgba(200,40,40,0.55); }

  #overlay {
    position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; background: rgba(5,7,15,0.85); border-radius: 10px; text-align: center; padding: 24px; z-index: 5;
  }
  #overlay.show { display: flex; }
  #overlay h2 { margin: 0; font-size: 24px; color: #ffe066; text-shadow: 0 0 14px rgba(255,224,102,0.6); }
  #overlay p { margin: 0; font-size: 14px; color: #b9c2f0; }
  #overlay-buttons { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  button.choice {
    background: linear-gradient(180deg, #5a6bff, #3444c4); color: #fff; border: none; padding: 10px 24px;
    font-size: 14px; border-radius: 999px; cursor: pointer; box-shadow: 0 4px 14px rgba(60,80,255,0.5);
    transition: transform 0.1s ease;
  }
  button.choice.secondary { background: transparent; border: 1px solid #6ea8ff; box-shadow: none; }
  button.choice:active { transform: scale(0.95); }
  #hint-text { font-size: 12px; color: #7c86c2; text-align: center; }

  #overlay-extra { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  #overlay-extra:empty { display: none; }
  #room-code {
    font-size: 40px; font-weight: 800; letter-spacing: 8px; color: #ffe066;
    background: rgba(255,224,102,0.08); border: 1px solid rgba(255,224,102,0.4);
    padding: 10px 26px; border-radius: 12px; text-shadow: 0 0 14px rgba(255,224,102,0.5);
  }
  #conn-status { font-size: 13px; color: #9aa3d6; }
  #code-input {
    width: 160px; font-size: 22px; letter-spacing: 6px; text-align: center; text-transform: uppercase;
    padding: 10px; border-radius: 10px; border: 1px solid #3a4278; background: rgba(255,255,255,0.05); color: #eef0ff;
  }
  #code-input:focus { outline: none; border-color: #6ea8ff; }
</style>
</head>
<body>
  <div id="wrap">
    <div id="topbar">
      <h1>将棋</h1>
      <div id="topbar-right">
        <button id="back-btn">モード選択</button>
        <a id="hub-link" href="../index.html">← ハブへ</a>
      </div>
    </div>

    <div id="hud">
      <div class="player-card" id="card-g">
        <div class="player-info">
          <span class="player-name" id="name-g">後手</span>
          <span class="player-status" id="status-g"></span>
        </div>
      </div>
      <div class="player-card" id="card-s">
        <div class="player-info">
          <span class="player-name" id="name-s">先手</span>
          <span class="player-status" id="status-s"></span>
        </div>
      </div>
    </div>

    <div id="hand-g"></div>
    <div id="board-area">
      <div id="board"></div>
      <div id="overlay">
        <h2 id="overlay-title">将棋</h2>
        <p id="overlay-text">対戦モードを選んでください</p>
        <div id="overlay-extra"></div>
        <div id="overlay-buttons"></div>
      </div>
    </div>
    <div id="hand-s"></div>
    <div id="hint-text">駒か持ち駒をクリックして選び、移動先／打つ場所をクリックしてください</div>
  </div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(() => {
  // ================= Core shogi engine (validated: perft(1)=30, nifu/forced-promo/uchifuzume checked) =================
  function idx(r,c){return r*9+c;}
  function inB(r,c){return r>=0&&r<9&&c>=0&&c<9;}

  function newGame() {
    const board = new Array(81).fill(null);
    const back = ['l','n','s','g','k','g','s','n','l'];
    for (let c=0;c<9;c++) {
      board[idx(0,c)] = { type: back[c], color:'g', promoted:false };
      board[idx(2,c)] = { type:'p', color:'g', promoted:false };
      board[idx(6,c)] = { type:'p', color:'s', promoted:false };
      board[idx(8,c)] = { type: back[c], color:'s', promoted:false };
    }
    board[idx(1,1)] = { type:'r', color:'g', promoted:false };
    board[idx(1,7)] = { type:'b', color:'g', promoted:false };
    board[idx(7,1)] = { type:'b', color:'s', promoted:false };
    board[idx(7,7)] = { type:'r', color:'s', promoted:false };
    return { board, turn: 's', hand: { s:{p:0,l:0,n:0,s:0,g:0,b:0,r:0}, g:{p:0,l:0,n:0,s:0,g:0,b:0,r:0} } };
  }

  function cloneState(st) {
    return {
      board: st.board.map(p => p ? {type:p.type,color:p.color,promoted:p.promoted} : null),
      turn: st.turn,
      hand: { s:{...st.hand.s}, g:{...st.hand.g} }
    };
  }

  function fwd(color){ return color==='s' ? -1 : 1; }
  function enemyOf(color){ return color==='s' ? 'g' : 's'; }
  function promoZone(color){ return color==='s' ? [0,1,2] : [6,7,8]; }
  function inPromoZone(color,row){ return promoZone(color).includes(row); }
  function farthest(color){ return color==='s' ? 0 : 8; }
  function farthest2(color){ return color==='s' ? [0,1] : [7,8]; }

  const DIAG = [[-1,-1],[-1,1],[1,-1],[1,1]];
  const ORTHO = [[-1,0],[1,0],[0,-1],[0,1]];
  const KING8 = DIAG.concat(ORTHO);

  function pieceTargets(board, piece, r, c) {
    const results = [];
    const color = piece.color;
    const f = fwd(color);
    const enemy = enemyOf(color);
    function tryStep(dr,dc) {
      const nr=r+dr, nc=c+dc;
      if (!inB(nr,nc)) return;
      const t = board[idx(nr,nc)];
      if (!t || t.color===enemy) results.push({r:nr,c:nc,captured:t});
    }
    function trySlide(dr,dc) {
      let nr=r+dr, nc=c+dc;
      while (inB(nr,nc)) {
        const t = board[idx(nr,nc)];
        if (!t) results.push({r:nr,c:nc,captured:null});
        else { if (t.color===enemy) results.push({r:nr,c:nc,captured:t}); break; }
        nr+=dr; nc+=dc;
      }
    }
    const GOLD = [[f,-1],[f,0],[f,1],[0,-1],[0,1],[-f,0]];
    const SILVER = [[f,-1],[f,0],[f,1],[-f,-1],[-f,1]];
    const t = piece.type, promoted = piece.promoted;
    if (t==='k') { for (const [dr,dc] of KING8) tryStep(dr,dc); }
    else if (t==='g') { for (const [dr,dc] of GOLD) tryStep(dr,dc); }
    else if (t==='p') { if (promoted) { for (const [dr,dc] of GOLD) tryStep(dr,dc); } else tryStep(f,0); }
    else if (t==='s') { if (promoted) { for (const [dr,dc] of GOLD) tryStep(dr,dc); } else { for (const [dr,dc] of SILVER) tryStep(dr,dc); } }
    else if (t==='n') { if (promoted) { for (const [dr,dc] of GOLD) tryStep(dr,dc); } else { tryStep(2*f,-1); tryStep(2*f,1); } }
    else if (t==='l') { if (promoted) { for (const [dr,dc] of GOLD) tryStep(dr,dc); } else trySlide(f,0); }
    else if (t==='b') { for (const [dr,dc] of DIAG) trySlide(dr,dc); if (promoted) for (const [dr,dc] of ORTHO) tryStep(dr,dc); }
    else if (t==='r') { for (const [dr,dc] of ORTHO) trySlide(dr,dc); if (promoted) for (const [dr,dc] of DIAG) tryStep(dr,dc); }
    return results;
  }

  function isSquareAttacked(board, r, c, byColor) {
    for (let i=0;i<81;i++) {
      const p = board[i];
      if (!p || p.color !== byColor) continue;
      const pr = (i/9)|0, pc = i%9;
      const targets = pieceTargets(board, p, pr, pc);
      if (targets.some(t => t.r===r && t.c===c)) return true;
    }
    return false;
  }

  function findKing(board, color) {
    for (let i=0;i<81;i++) { const p=board[i]; if (p && p.type==='k' && p.color===color) return {r:(i/9)|0,c:i%9}; }
    return null;
  }
  function isInCheck(state, color) {
    const k = findKing(state.board, color);
    if (!k) return false;
    return isSquareAttacked(state.board, k.r, k.c, enemyOf(color));
  }

  const PROMOTABLE = ['p','l','n','s','b','r'];

  function genPseudoBoardMoves(state) {
    const moves = [];
    const board = state.board, color = state.turn;
    for (let r=0;r<9;r++) for (let c=0;c<9;c++) {
      const p = board[idx(r,c)];
      if (!p || p.color !== color) continue;
      const targets = pieceTargets(board, p, r, c);
      for (const t of targets) {
        const canPromote = PROMOTABLE.includes(p.type) && !p.promoted && (inPromoZone(color,r) || inPromoZone(color,t.r));
        if (canPromote) {
          const forced = ((p.type==='p'||p.type==='l') && t.r===farthest(color)) ||
                         (p.type==='n' && farthest2(color).includes(t.r));
          if (forced) {
            moves.push({type:'move', from:{r,c}, to:{r:t.r,c:t.c}, piece:p, captured:t.captured, promote:true});
          } else {
            moves.push({type:'move', from:{r,c}, to:{r:t.r,c:t.c}, piece:p, captured:t.captured, promote:false});
            moves.push({type:'move', from:{r,c}, to:{r:t.r,c:t.c}, piece:p, captured:t.captured, promote:true});
          }
        } else {
          moves.push({type:'move', from:{r,c}, to:{r:t.r,c:t.c}, piece:p, captured:t.captured, promote:false});
        }
      }
    }
    return moves;
  }

  function genPseudoDropMoves(state) {
    const moves = [];
    const board = state.board, color = state.turn;
    const hand = state.hand[color];
    for (const pieceType of Object.keys(hand)) {
      if (hand[pieceType] <= 0) continue;
      for (let r=0;r<9;r++) for (let c=0;c<9;c++) {
        if (board[idx(r,c)]) continue;
        if (pieceType==='p') {
          if (r===farthest(color)) continue;
          let nifu = false;
          for (let rr=0;rr<9;rr++) { const q=board[idx(rr,c)]; if (q && q.color===color && q.type==='p' && !q.promoted) { nifu=true; break; } }
          if (nifu) continue;
        } else if (pieceType==='l') {
          if (r===farthest(color)) continue;
        } else if (pieceType==='n') {
          if (farthest2(color).includes(r)) continue;
        }
        moves.push({type:'drop', pieceType, to:{r,c}, color});
      }
    }
    return moves;
  }

  function applyMove(state, move) {
    const ns = cloneState(state);
    const board = ns.board;
    if (move.type === 'move') {
      const { from, to, piece, captured, promote } = move;
      board[idx(from.r,from.c)] = null;
      const placed = { type: piece.type, color: piece.color, promoted: piece.promoted || promote };
      board[idx(to.r,to.c)] = placed;
      if (captured) ns.hand[state.turn][captured.type] += 1;
    } else {
      const { pieceType, to, color } = move;
      board[idx(to.r,to.c)] = { type: pieceType, color, promoted:false };
      ns.hand[color][pieceType] -= 1;
    }
    ns.turn = enemyOf(state.turn);
    return ns;
  }

  function genLegalMoves(state) {
    const pseudo = genPseudoBoardMoves(state).concat(genPseudoDropMoves(state));
    const legal = [];
    for (const m of pseudo) {
      const ns = applyMove(state, m);
      if (isInCheck(ns, state.turn)) continue;
      if (m.type === 'drop' && m.pieceType === 'p') {
        if (isInCheck(ns, ns.turn)) {
          const oppMoves = genLegalMoves(ns);
          if (oppMoves.length === 0) continue;
        }
      }
      legal.push(m);
    }
    return legal;
  }

  // ---------- Evaluation & AI ----------
  const BASE_VALUE = { p:100, l:300, n:350, s:500, g:550, b:800, r:1000, k:0 };
  function pieceValue(piece) {
    if (!piece.promoted) return BASE_VALUE[piece.type];
    if (piece.type==='b') return 1050;
    if (piece.type==='r') return 1250;
    return 550;
  }
  function evaluate(state) {
    let score = 0;
    for (const p of state.board) { if (!p) continue; const v = pieceValue(p); score += p.color==='s' ? v : -v; }
    for (const t of Object.keys(state.hand.s)) score += state.hand.s[t] * BASE_VALUE[t];
    for (const t of Object.keys(state.hand.g)) score -= state.hand.g[t] * BASE_VALUE[t];
    return score;
  }
  function moveOrderScore(m) {
    if (m.type==='drop') return m.pieceType==='p' ? -10 : 50;
    let s = m.promote ? 400 : 0;
    if (m.captured) s += pieceValue(m.captured)*10 - pieceValue(m.piece);
    return s;
  }
  function orderMoves(moves) { return moves.slice().sort((a,b)=>moveOrderScore(b)-moveOrderScore(a)); }

  function negamax(state, depth, alpha, beta, colorMul) {
    const moves = genLegalMoves(state);
    if (moves.length === 0) return isInCheck(state, state.turn) ? -100000 - depth : 0;
    if (depth === 0) return colorMul * evaluate(state);
    const ordered = orderMoves(moves);
    let best = -Infinity;
    for (const m of ordered) {
      const ns = applyMove(state, m);
      const val = -negamax(ns, depth-1, -beta, -alpha, -colorMul);
      if (val > best) best = val;
      if (best > alpha) alpha = best;
      if (alpha >= beta) break;
    }
    return best;
  }
  function findBestMove(state, depth) {
    const moves = orderMoves(genLegalMoves(state));
    if (moves.length===0) return null;
    const colorMul = state.turn==='s' ? 1 : -1;
    let bestMove=moves[0], bestVal=-Infinity, alpha=-Infinity, beta=Infinity;
    for (const m of moves) {
      const ns = applyMove(state, m);
      const val = -negamax(ns, depth-1, -beta, -alpha, -colorMul);
      if (val>bestVal) { bestVal=val; bestMove=m; }
      if (bestVal>alpha) alpha=bestVal;
    }
    return bestMove;
  }

  // ================= UI layer =================
  const KANJI = { p:'歩', l:'香', n:'桂', s:'銀', g:'金', b:'角', r:'飛', k:'王' };
  const KANJI_GOTE_KING = '玉';
  const KANJI_PROMOTED = { p:'と', l:'杏', n:'圭', s:'全', b:'馬', r:'龍' };
  const HAND_ORDER = ['r','b','g','s','n','l','p'];

  function glyphFor(piece) {
    if (piece.type === 'k') return piece.color === 's' ? KANJI.k : KANJI_GOTE_KING;
    if (piece.promoted) return KANJI_PROMOTED[piece.type];
    return KANJI[piece.type];
  }

  const boardEl = document.getElementById('board');
  const handGEl = document.getElementById('hand-g');
  const handSEl = document.getElementById('hand-s');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlay-title');
  const overlayText = document.getElementById('overlay-text');
  const overlayButtons = document.getElementById('overlay-buttons');
  const overlayExtra = document.getElementById('overlay-extra');
  const backBtn = document.getElementById('back-btn');
  const cardG = document.getElementById('card-g');
  const cardS = document.getElementById('card-s');
  const nameG = document.getElementById('name-g');
  const nameS = document.getElementById('name-s');
  const statusG = document.getElementById('status-g');
  const statusS = document.getElementById('status-s');

  let state, mode, humanColor, aiColor, gameActive, selectedSquare, selectedDrop, legalTargets, lastMove;
  let peer = null, conn = null, roomCode = null;
  const AI_DEPTH = 3;

  function setBoardDisabled(disabled) { boardEl.classList.toggle('disabled', disabled); }

  function renderHand(color) {
    const el = color === 's' ? handSEl : handGEl;
    el.innerHTML = '';
    const hand = state.hand[color];
    const canInteract = gameActive && state.turn === color && !((mode === 'cpu' || mode === 'online') && state.turn !== humanColor);
    for (const t of HAND_ORDER) {
      const cnt = hand[t];
      if (cnt <= 0) continue;
      const btn = document.createElement('div');
      btn.className = 'hand-piece' + (color==='g' ? ' gote' : '');
      if (!canInteract) btn.classList.add('disabled');
      if (selectedDrop && selectedDrop.color===color && selectedDrop.pieceType===t) btn.classList.add('selected');
      const glyphSpan = document.createElement('span');
      glyphSpan.textContent = KANJI[t];
      if (color==='g') glyphSpan.style.display = 'inline-block';
      if (color==='g') glyphSpan.style.transform = 'rotate(180deg)';
      btn.appendChild(glyphSpan);
      const cntSpan = document.createElement('span');
      cntSpan.className = 'cnt';
      cntSpan.textContent = 'x' + cnt;
      btn.appendChild(cntSpan);
      btn.addEventListener('click', () => onHandClick(color, t));
      el.appendChild(btn);
    }
  }

  function renderBoard() {
    boardEl.innerHTML = '';
    const checkColor = isInCheck(state, state.turn) ? state.turn : null;
    for (let r=0;r<9;r++) {
      for (let c=0;c<9;c++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        if (lastMove) {
          if (lastMove.type==='move' && lastMove.from.r===r && lastMove.from.c===c) cell.classList.add('last-from');
          if (lastMove.to.r===r && lastMove.to.c===c) cell.classList.add('last-to');
        }
        if (selectedSquare && selectedSquare.r===r && selectedSquare.c===c) cell.classList.add('selected');
        const p = state.board[idx(r,c)];
        if (p) {
          if (checkColor && p.type==='k' && p.color===checkColor) cell.classList.add('check');
          const span = document.createElement('span');
          span.className = 'piece ' + p.color + (p.promoted ? ' promoted' : '');
          span.textContent = glyphFor(p);
          cell.appendChild(span);
        }
        if (legalTargets) {
          const mv = legalTargets.find(m => m.to.r===r && m.to.c===c);
          if (mv) {
            const dot = document.createElement('div');
            dot.className = 'dot-hint' + (mv.type==='move' && mv.captured ? ' capture' : '');
            cell.appendChild(dot);
          }
        }
        cell.addEventListener('click', () => onCellClick(r,c));
        boardEl.appendChild(cell);
      }
    }
    renderHand('s');
    renderHand('g');
  }

  function updateHUD() {
    cardS.classList.toggle('active', state.turn === 's' && gameActive);
    cardG.classList.toggle('active', state.turn === 'g' && gameActive);
    if (mode === 'cpu') {
      nameS.textContent = '先手' + (humanColor === 's' ? '(あなた)' : '(CPU)');
      nameG.textContent = '後手' + (humanColor === 'g' ? '(あなた)' : '(CPU)');
    } else if (mode === 'online') {
      nameS.textContent = '先手' + (humanColor === 's' ? '(あなた)' : '(相手)');
      nameG.textContent = '後手' + (humanColor === 'g' ? '(あなた)' : '(相手)');
    } else {
      nameS.textContent = '先手';
      nameG.textContent = '後手';
    }
    statusS.textContent = gameActive && state.turn==='s' && isInCheck(state,'s') ? '王手！' : '';
    statusG.textContent = gameActive && state.turn==='g' && isInCheck(state,'g') ? '王手！' : '';
  }

  function clearSelection() { selectedSquare = null; selectedDrop = null; legalTargets = null; }

  function onHandClick(color, pieceType) {
    if (!gameActive) return;
    if (state.turn !== color) return;
    if ((mode === 'cpu' || mode === 'online') && state.turn !== humanColor) return;
    if (selectedDrop && selectedDrop.color===color && selectedDrop.pieceType===pieceType) { clearSelection(); renderBoard(); return; }
    selectedSquare = null;
    selectedDrop = { color, pieceType };
    legalTargets = genLegalMoves(state).filter(m => m.type==='drop' && m.pieceType===pieceType);
    renderBoard();
  }

  function onCellClick(r, c) {
    if (!gameActive) return;
    if ((mode === 'cpu' || mode === 'online') && state.turn !== humanColor) return;
    const clickedPiece = state.board[idx(r,c)];

    if (legalTargets) {
      const candidates = legalTargets.filter(m => m.to.r===r && m.to.c===c);
      if (candidates.length > 0) {
        if (candidates.length > 1) {
          showPromotionPicker(candidates);
        } else {
          commitMove(candidates[0]);
        }
        return;
      }
    }
    if (clickedPiece && clickedPiece.color === state.turn) {
      selectedDrop = null;
      selectedSquare = { r, c };
      legalTargets = genLegalMoves(state).filter(m => m.type==='move' && m.from.r===r && m.from.c===c);
      renderBoard();
    } else {
      clearSelection();
      renderBoard();
    }
  }

  function showPromotionPicker(candidates) {
    const promoteMove = candidates.find(m => m.promote);
    const plainMove = candidates.find(m => !m.promote);
    overlayTitle.textContent = '成りますか？';
    overlayText.textContent = '';
    overlayExtra.innerHTML = '';
    overlayButtons.innerHTML = '';
    const mk = (label, mv) => {
      const btn = document.createElement('button');
      btn.className = 'choice';
      btn.textContent = label;
      btn.addEventListener('click', () => { overlay.classList.remove('show'); commitMove(mv); });
      overlayButtons.appendChild(btn);
    };
    mk('成る', promoteMove);
    mk('成らない', plainMove);
    overlay.classList.add('show');
  }

  function commitMove(move, broadcast = true) {
    const mover = state.turn;
    state = applyMove(state, move);
    lastMove = move;
    clearSelection();
    if (mode === 'online' && broadcast && mover === humanColor && conn) {
      conn.send({ type: 'move', payload: move });
    }
    renderBoard();
    updateHUD();
    checkGameEnd();
    if (gameActive) proceedTurn();
  }

  function checkGameEnd() {
    const moves = genLegalMoves(state);
    if (moves.length === 0) {
      gameActive = false;
      setBoardDisabled(true);
      const inCheck = isInCheck(state, state.turn);
      let title, text;
      if (inCheck) {
        const winner = enemyOf(state.turn);
        text = (winner === 's' ? '先手' : '後手') + 'の勝ち（詰み）';
        if (mode === 'cpu') title = winner === humanColor ? 'あなたの勝ち！' : 'CPUの勝ち';
        else if (mode === 'online') title = winner === humanColor ? 'あなたの勝ち！' : '相手の勝ち';
        else title = (winner === 's' ? '先手' : '後手') + 'の勝ち！';
      } else {
        title = '引き分け';
        text = '動かせる駒がありません';
      }
      showResult(title, text);
    }
  }

  function showResult(title, text) {
    const buttons = mode === 'online'
      ? [
          { label: 'もう一度', primary: true, onClick: () => { if (conn) conn.send({ type: 'rematch' }); startGame('online', humanColor); } },
          { label: 'モード選択に戻る', primary: false, onClick: () => { cleanupPeer(); showModeSelect(); } }
        ]
      : [
          { label: 'もう一度', primary: true, onClick: () => startGame(mode, humanColor) },
          { label: 'モード選択に戻る', primary: false, onClick: showModeSelect }
        ];
    showOverlay(title, text, buttons);
  }

  function proceedTurn() {
    if (mode === 'cpu' && state.turn === aiColor) {
      setBoardDisabled(true);
      setTimeout(doAIMove, 350);
    } else if (mode === 'online' && state.turn !== humanColor) {
      setBoardDisabled(true);
    } else {
      setBoardDisabled(false);
    }
  }

  function doAIMove() {
    if (!gameActive) return;
    const move = findBestMove(state, AI_DEPTH);
    if (move) commitMove(move);
  }

  // ---------- overlay screens ----------
  function showOverlay(title, text, buttons, extraHtml) {
    overlayTitle.textContent = title;
    overlayText.textContent = text;
    overlayExtra.innerHTML = extraHtml || '';
    overlayButtons.innerHTML = '';
    for (const b of buttons) {
      const btn = document.createElement('button');
      btn.className = 'choice' + (b.primary ? '' : ' secondary');
      btn.textContent = b.label;
      btn.addEventListener('click', b.onClick);
      overlayButtons.appendChild(btn);
    }
    overlay.classList.add('show');
  }
  function hideOverlay() { overlay.classList.remove('show'); }

  function showModeSelect() {
    cleanupPeer();
    gameActive = false;
    state = newGame();
    clearSelection(); lastMove = null;
    mode = null;
    renderBoard();
    updateHUD();
    cardS.classList.remove('active');
    cardG.classList.remove('active');
    showOverlay('将棋', '対戦モードを選んでください', [
      { label: '対人戦（同じ画面）', primary: true, onClick: () => startGame('pvp', 's') },
      { label: 'CPU戦', primary: true, onClick: showColorSelect },
      { label: 'オンライン対戦（別のPC）', primary: true, onClick: showOnlineMenu }
    ]);
  }

  function showColorSelect() {
    showOverlay('CPU戦', 'あなたの手番を選んでください', [
      { label: '先手で始める', primary: true, onClick: () => startGame('cpu', 's') },
      { label: '後手で始める', primary: true, onClick: () => startGame('cpu', 'g') },
      { label: '戻る', primary: false, onClick: showModeSelect }
    ]);
  }

  // ---------- online multiplayer (WebRTC via PeerJS) ----------
  function cleanupPeer() {
    if (conn) { try { conn.close(); } catch (e) {} conn = null; }
    if (peer) { try { peer.destroy(); } catch (e) {} peer = null; }
  }
  function randomCode(len = 4) {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let s = '';
    for (let i = 0; i < len; i++) s += chars[Math.floor(Math.random() * chars.length)];
    return s;
  }
  function showOnlineMenu() {
    showOverlay('オンライン対戦', 'インターネット経由で別のパソコンの人と対戦できます', [
      { label: '部屋を作る（ホスト）', primary: true, onClick: hostRoom },
      { label: '部屋に入る（参加）', primary: true, onClick: showJoinRoom },
      { label: '戻る', primary: false, onClick: showModeSelect }
    ]);
  }
  function setupConnection() {
    conn.on('data', handleRemoteData);
    conn.on('close', onPeerDisconnected);
    conn.on('error', onPeerDisconnected);
  }
  function onPeerDisconnected() {
    if (mode === 'online' && gameActive) {
      gameActive = false;
      setBoardDisabled(true);
      showOverlay('相手が切断しました', '通信が切れてしまいました', [
        { label: 'モード選択に戻る', primary: true, onClick: showModeSelect }
      ]);
    }
  }
  function handleRemoteData(data) {
    if (!data || typeof data !== 'object') return;
    if (data.type === 'move') {
      const p = data.payload;
      const moves = genLegalMoves(state);
      let m;
      if (p.type === 'drop') {
        m = moves.find(mm => mm.type==='drop' && mm.pieceType===p.pieceType && mm.to.r===p.to.r && mm.to.c===p.to.c);
      } else {
        m = moves.find(mm => mm.type==='move' && mm.from.r===p.from.r && mm.from.c===p.from.c &&
                              mm.to.r===p.to.r && mm.to.c===p.to.c && !!mm.promote===!!p.promote);
      }
      if (m) commitMove(m, false);
    } else if (data.type === 'rematch') {
      startGame('online', humanColor);
    }
  }
  function hostRoom() {
    cleanupPeer();
    roomCode = randomCode();
    showOverlay('オンライン対戦', '部屋を準備しています…', [
      { label: 'キャンセル', primary: false, onClick: showModeSelect }
    ]);
    peer = new Peer('shogi-room-' + roomCode);
    peer.on('open', () => {
      showOverlay(
        'このコードを相手に伝えてください',
        '相手が「部屋に入る」からコードを入力すると自動で対戦が始まります（あなたは先手です）',
        [{ label: 'キャンセル', primary: false, onClick: showModeSelect }],
        `<div id="room-code">${roomCode}</div>
         <button id="copy-code-btn" class="choice secondary">コードをコピー</button>
         <div id="conn-status">相手の参加を待っています…</div>`
      );
      const copyBtn = document.getElementById('copy-code-btn');
      if (copyBtn) {
        copyBtn.addEventListener('click', () => {
          navigator.clipboard.writeText(roomCode).then(() => {
            copyBtn.textContent = 'コピーしました！';
            setTimeout(() => { copyBtn.textContent = 'コードをコピー'; }, 1500);
          });
        });
      }
    });
    peer.on('connection', (c) => {
      conn = c;
      setupConnection();
      conn.on('open', () => startGame('online', 's'));
    });
    peer.on('error', () => {
      showOverlay('接続エラー', '部屋を作成できませんでした。もう一度お試しください。', [
        { label: '戻る', primary: true, onClick: showModeSelect }
      ]);
    });
  }
  function showJoinRoom() {
    cleanupPeer();
    showOverlay(
      '部屋に入る',
      'ホストから伝えられた4桁のコードを入力してください',
      [
        { label: '接続する', primary: true, onClick: joinRoom },
        { label: '戻る', primary: false, onClick: showModeSelect }
      ],
      `<input id="code-input" maxlength="4" placeholder="例: A1B2" autocomplete="off" />`
    );
    const input = document.getElementById('code-input');
    if (input) {
      input.focus();
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') joinRoom(); });
    }
  }
  function joinRoom() {
    const input = document.getElementById('code-input');
    const code = input ? input.value.trim().toUpperCase() : '';
    if (!code) return;
    cleanupPeer();
    showOverlay('接続中…', 'ホストの部屋に接続しています', [
      { label: 'キャンセル', primary: false, onClick: showModeSelect }
    ]);
    peer = new Peer();
    peer.on('open', () => {
      conn = peer.connect('shogi-room-' + code, { reliable: true });
      setupConnection();
      conn.on('open', () => startGame('online', 'g'));
      conn.on('error', () => {
        showOverlay('接続エラー', 'コードが正しいか、ホストが待機しているか確認してください。', [
          { label: 'もう一度', primary: true, onClick: showJoinRoom },
          { label: '戻る', primary: false, onClick: showModeSelect }
        ]);
      });
    });
    peer.on('error', () => {
      showOverlay('接続エラー', 'コードが正しいか、ホストが待機しているか確認してください。', [
        { label: 'もう一度', primary: true, onClick: showJoinRoom },
        { label: '戻る', primary: false, onClick: showModeSelect }
      ]);
    });
  }

  function startGame(selectedMode, chosenHumanColor) {
    mode = selectedMode;
    humanColor = chosenHumanColor;
    aiColor = enemyOf(humanColor);
    state = newGame();
    clearSelection(); lastMove = null;
    gameActive = true;
    renderBoard();
    updateHUD();
    hideOverlay();
    proceedTurn();
  }

  backBtn.addEventListener('click', showModeSelect);
  window.addEventListener('beforeunload', cleanupPeer);

  showModeSelect();
})();
</script>
</body>
</html>
